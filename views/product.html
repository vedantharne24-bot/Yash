<section class="container product-page" data-slug="{{SLUG}}">
  <a href="/merch" class="back-link">← Back to Store</a>
  <div class="product-layout">
    <div class="product-gallery">
      <div class="pg-main"><img id="pImg" src="" alt="" /></div>
      <div class="pg-thumbs" id="pThumbs"></div>
      <p class="muted small" id="pNote"></p>
    </div>
    <div class="product-info">
      <div class="chip-row left"><span class="chip chip-lime" id="pStock">IN STOCK</span><span class="chip chip-outline" id="pCat"></span></div>
      <h1 id="pName"></h1>
      <div class="p-price big"><b id="pPrice"></b><s id="pMrp"></s><span class="save" id="pSave"></span></div>
      <p class="muted" id="pDesc"></p>

      <div id="fitBox">
        <span class="opt-label">SELECT FIT</span>
        <div class="seg" id="fitSeg">
          <button type="button" data-fit="Regular">Regular</button>
          <button type="button" data-fit="Oversized" class="on">Oversized</button>
        </div>
        <div class="opt-row"><span class="opt-label">SELECT SIZE</span><button type="button" class="link-btn" id="sizeChartBtn">📏 Size Chart</button></div>
        <div class="sizes" id="sizes"></div>
      </div>

      <div class="qty-row">
        <div class="qty"><button type="button" id="qMinus" aria-label="Decrease">−</button><span id="qVal">1</span><button type="button" id="qPlus" aria-label="Increase">+</button></div>
        <button class="btn btn-blue btn-wide" id="addBtn">ADD TO BAG <span class="btn-dot">+</span></button>
      </div>

      <div class="perks">
        <div><b>📍 Venue Pickup</b><small>Collect at the hackathon</small></div>
        <div><b>✔ Official Merch</b><small>100% authentic quality</small></div>
      </div>
    </div>
  </div>
</section>

<div class="modal" id="sizeModal" aria-hidden="true">
  <div class="modal-card modal-white">
    <button class="popup-close" data-close aria-label="Close">&times;</button>
    <span class="chip chip-lime">SIZE CHART (INCHES)</span>
    <h3>Find your fit</h3>
    <table class="size-table">
      <thead><tr><th>Size</th><th>Chest (Regular)</th><th>Chest (Oversized)</th><th>Length</th></tr></thead>
      <tbody>
        <tr><td>XS</td><td>36</td><td>40</td><td>26</td></tr>
        <tr><td>S</td><td>38</td><td>42</td><td>27</td></tr>
        <tr><td>M</td><td>40</td><td>44</td><td>28</td></tr>
        <tr><td>L</td><td>42</td><td>46</td><td>29</td></tr>
        <tr><td>XL</td><td>44</td><td>48</td><td>30</td></tr>
        <tr><td>XXL</td><td>46</td><td>50</td><td>31</td></tr>
        <tr><td>XXXL</td><td>48</td><td>52</td><td>32</td></tr>
      </tbody>
    </table>
  </div>
</div>
